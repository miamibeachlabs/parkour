id: parkour
name: Parkour

categories:
  - id: impact
    name: Impact and landing
    description: Landing and rolling patterns that make later movement safer.
  - id: ground
    name: Ground movement and transitions
    description: Locomotion, low positions, and supported transitions through the ground.
  - id: vaults
    name: Obstacle transit
    description: Controlled ways to pass obstacles.
  - id: jumping
    name: Jumping and landing
    description: Distance, precision, rebound, and movement through space.
  - id: vertical
    name: Vertical movement and hanging
    description: Using walls and bars to redirect, gain height, or support bodyweight.
  - id: rotation
    name: Rotation, inversion, and kicking
    description: Controlled turning, inversion, and spatial orientation through movement.
  - id: capacity
    name: Mobility and general capacity
    description: Strength, range, and conditioning that make the rest of practice available.

skills:
  - id: animal-landing
    name: Animal landing
    category: impact
    importance: foundational
    description: Absorb a landing quietly through ankles, knees, and hips.
    tutorial: https://www.youtube.com/watch?v=Ww2Ui0BftaI
  - id: sideways-roll
    name: Sideways roll
    category: impact
    importance: foundational
    description: A low-risk roll pattern for distributing impact.
    tutorial: https://www.youtube.com/watch?v=uqPFIa4RFPk
  - id: shoulder-roll
    name: Shoulder roll
    category: impact
    importance: foundational
    description: Route forward momentum diagonally across the upper back, away from neck and spine.
    tutorial: https://www.youtube.com/watch?v=fGpU2fsEYuM
  - id: monkey-walk
    name: Monkey walk
    category: ground
    importance: useful
    description: Low four-point locomotion for weight transfer and joint comfort.
    tutorial: https://www.youtube.com/watch?v=1jS4AbKr30w
  - id: quadrupedal-movement
    name: Quadrupedal movement
    category: ground
    importance: useful
    description: Move forward, backward, and sideways on hands and feet with a stable trunk.
    tutorial: https://www.youtube.com/watch?v=ApYvgfOlkxI
  - id: ground-kong
    name: Ground kong
    category: ground
    importance: useful
    description: A floor-level kong pattern for hand placement and hip drive.
    tutorial: https://www.youtube.com/watch?v=IG1yR4k0ypI
  - id: safety-vault
    name: Safety vault
    category: vaults
    importance: useful
    description: Pass an obstacle while retaining a hand and foot for control.
    tutorial: https://www.youtube.com/watch?v=Cs4GtrzA8Ao
  - id: sit-spin-vault
    name: Sit-spin vault
    category: vaults
    importance: optional
    description: A controlled seated rotation around an obstacle.
    tutorial: https://www.youtube.com/watch?v=Lz6df5KsPdU
  - id: turn-vault
    name: Turn vault
    category: vaults
    importance: optional
    description: Clear an obstacle and reorient to land facing back toward it.
    tutorial: https://www.youtube.com/watch?v=Q3SSiBaYvEM
  - id: kong-vault
    name: Kong vault
    category: vaults
    importance: useful
    description: Drive hips and legs between planted hands, beginning over very low obstacles.
    tutorial: https://www.youtube.com/watch?v=ZX5AGLw5hb8
  - id: precision-landing
    name: Precision landing
    category: jumping
    importance: foundational
    description: Land accurately on a marked or narrow target with quiet absorption.
    tutorial: https://www.youtube.com/watch?v=CD_W8BYNs2k
  - id: standing-jump
    name: Standing jump
    category: jumping
    importance: useful
    description: Produce horizontal distance from a stable two-foot takeoff.
    tutorial: https://www.youtube.com/watch?v=K8DtVb0ydc8
  - id: plyometric-jumps
    name: Plyometric jumps
    category: jumping
    importance: optional
    description: Elastic rebounding jumps, added only after ordinary jump volume is comfortable.
    tutorial: https://www.youtube.com/watch?v=cytB585tI8U
  - id: running-jump
    name: Running jump
    category: jumping
    importance: useful
    description: Turn approach speed into a deliberate takeoff and stable landing.
    tutorial: https://www.youtube.com/watch?v=_D6WsID--IQ
  - id: strides
    name: Strides
    category: jumping
    importance: optional
    description: Link alternating takeoffs across targets while maintaining rhythm and line.
    tutorial: https://www.youtube.com/watch?v=IAnd7gSgHGg
  - id: wall-run
    name: Wall run
    category: vertical
    importance: optional
    description: Use a purposeful foot contact to gain height or redirect movement.
    tutorial: https://www.youtube.com/watch?v=cnijAVbly84
  - id: ginga
    name: Ginga
    category: ground
    origin: capoeira
    importance: useful
    description: A relaxed, shifting base that builds rhythm, coordination, and transitions between positions.
    tutorial: https://www.youtube.com/watch?v=HbUxXJKitS4
  - id: negativa
    name: Negativa
    category: ground
    origin: capoeira
    importance: useful
    description: A low, supported position for moving safely between standing and the ground.
    tutorial: https://www.youtube.com/watch?v=iRb8inBYpf0
  - id: role
    name: Rolê
    category: ground
    origin: capoeira
    importance: useful
    description: A circular ground transition that links supported positions with a return to movement.
    tutorial: https://www.youtube.com/watch?v=YkjKw8FPA6Y
  - id: meia-lua-de-frente
    name: Meia-lua de frente
    category: rotation
    origin: capoeira
    importance: optional
    description: A controlled front crescent kick for rotational coordination and balance.
    tutorial: https://www.youtube.com/watch?v=mQkcWdbaV3o
  - id: queixada
    name: Queixada
    category: rotation
    origin: capoeira
    importance: optional
    description: A turning, outside-in kick that develops rotation and controlled reorientation.
    tutorial: https://www.youtube.com/watch?v=-VlCCRnKfLs
  - id: armada
    name: Armada
    category: rotation
    origin: capoeira
    importance: optional
    description: A spinning kick practiced for deliberate turning, orientation, and balance.
    tutorial: https://www.youtube.com/watch?v=mPVHfPh9nPU
  - id: pogos
    name: Pogos
    category: jumping
    origin: calisthenics
    importance: useful
    description: Small, controlled two-foot rebounds that develop ankle elasticity and quiet reactive landings.
    tutorial: https://www.youtube.com/watch?v=PdhY2bCMJgQ
  - id: skipping-drills
    name: Skipping drills
    category: jumping
    origin: calisthenics
    importance: useful
    description: Light skipping and B-skip patterns for rhythm, coordination, and springy running mechanics.
    tutorial: https://alpfitness.com/knowledge-base/running-drills/
  - id: bear-walk
    name: Bear walk
    category: ground
    origin: animal-flow
    importance: useful
    description: Four-point locomotion with hands and feet moving beneath a stable trunk.
    tutorial: https://gmb.io/bear/
  - id: crab-walk
    name: Crab walk
    category: ground
    origin: animal-flow
    importance: useful
    description: Reverse-facing ground locomotion that develops shoulder support and spatial awareness.
    tutorial: https://help.gmb.io/article/553-additional-exercise-tutorials-help
  - id: lizard-walk
    name: Lizard walk
    category: ground
    origin: animal-flow
    importance: optional
    description: Low crawling locomotion that asks for coordinated shoulder support and hip movement.
    tutorial: https://www.youtube.com/watch?v=NX6JvqPqWio
  - id: bar-hang
    name: Bar hang
    category: vertical
    origin: calisthenics
    importance: useful
    description: A relaxed or active hang for grip, shoulder comfort, and vertical body support.
    tutorial: https://gmb.io/hanging/
  - id: cartwheel-au
    name: Cartwheel / au
    category: rotation
    origin: capoeira
    importance: useful
    description: A controlled sideways inversion that returns smoothly to standing.
    tutorial: https://www.youtube.com/watch?v=Br3rusbuKPY
  - id: wheel-backbend
    name: Wheel / backbend
    category: rotation
    origin: mobility
    importance: optional
    description: A controlled bridge or wheel shape used for inversion, shoulder range, and spinal extension.
    tutorial: https://gmb.io/bridge/
  - id: low-au
    name: Low au
    category: rotation
    origin: capoeira
    importance: useful
    description: A low, compact cartwheel variation with close-to-ground feet.
    tutorial: https://www.youtube.com/watch?v=QOo21W_rR54
  - id: meia-lua-de-compasso
    name: Meia-lua de compasso
    category: rotation
    origin: capoeira
    importance: optional
    description: A turning, hands-supported kicking pattern that combines hinge, rotation, and reorientation.
    tutorial: https://www.youtube.com/watch?v=IiLqVCyyoPs
  - id: lunges
    name: Lunges
    category: capacity
    origin: general-training
    importance: useful
    description: Controlled stepping lunges for single-leg strength, hip range, and balance.
    tutorial: https://gmb.io/bodyweight-leg-exercises/
  - id: walking-front-kicks
    name: Walking front kicks
    category: capacity
    origin: mobility
    importance: optional
    description: Slow walking front kicks used as dynamic leg mobility and balance practice.
    tutorial: https://fitbod.me/exercises/walking-front-kicks
  - id: bag-work
    name: Bag work
    category: capacity
    origin: striking
    importance: optional
    description: Controlled striking or kicking rounds for conditioning and coordinated force production.
    tutorial: https://www.youtube.com/watch?v=r1x-LrAnS10
