id: parkour
name: Parkour

categories:
  - id: impact
    name: Impact safety
    description: Landing and rolling patterns that make later movement safer.
  - id: ground
    name: Ground movement
    description: Low body-control patterns for moving through and around space.
  - id: vaults
    name: Vaults
    description: Controlled ways to pass obstacles.
  - id: jumping
    name: Jumping and landing
    description: Distance, precision, rebound, and movement through space.
  - id: walls
    name: Wall skills
    description: Using a wall to redirect or gain height.
  - id: rotation
    name: Rotational movement
    description: Controlled turning and spatial orientation through movement.

skills:
  - id: animal-landing
    name: Animal landing
    category: impact
    importance: foundational
    description: Absorb a landing quietly through ankles, knees, and hips.
    tutorial: https://www.youtube.com/watch?v=Ww2Ui0BftaI
  - id: sideways-roll
    name: Sideways roll
    category: impact
    importance: foundational
    description: A low-risk roll pattern for distributing impact.
    tutorial: https://www.youtube.com/watch?v=uqPFIa4RFPk
  - id: shoulder-roll
    name: Shoulder roll
    category: impact
    importance: foundational
    description: Route forward momentum diagonally across the upper back, away from neck and spine.
    tutorial: https://www.youtube.com/watch?v=fGpU2fsEYuM
  - id: monkey-walk
    name: Monkey walk
    category: ground
    importance: useful
    description: Low four-point locomotion for weight transfer and joint comfort.
    tutorial: https://www.youtube.com/watch?v=1jS4AbKr30w
  - id: quadrupedal-movement
    name: Quadrupedal movement
    category: ground
    importance: useful
    description: Move forward, backward, and sideways on hands and feet with a stable trunk.
    tutorial: https://www.youtube.com/watch?v=ApYvgfOlkxI
  - id: ground-kong
    name: Ground kong
    category: ground
    importance: useful
    description: A floor-level kong pattern for hand placement and hip drive.
    tutorial: https://www.youtube.com/watch?v=IG1yR4k0ypI
  - id: safety-vault
    name: Safety vault
    category: vaults
    importance: useful
    description: Pass an obstacle while retaining a hand and foot for control.
    tutorial: https://www.youtube.com/watch?v=Cs4GtrzA8Ao
  - id: sit-spin-vault
    name: Sit-spin vault
    category: vaults
    importance: optional
    description: A controlled seated rotation around an obstacle.
    tutorial: https://www.youtube.com/watch?v=Lz6df5KsPdU
  - id: turn-vault
    name: Turn vault
    category: vaults
    importance: optional
    description: Clear an obstacle and reorient to land facing back toward it.
    tutorial: https://www.youtube.com/watch?v=Q3SSiBaYvEM
  - id: kong-vault
    name: Kong vault
    category: vaults
    importance: useful
    description: Drive hips and legs between planted hands, beginning over very low obstacles.
    tutorial: https://www.youtube.com/watch?v=ZX5AGLw5hb8
  - id: precision-landing
    name: Precision landing
    category: jumping
    importance: foundational
    description: Land accurately on a marked or narrow target with quiet absorption.
    tutorial: https://www.youtube.com/watch?v=CD_W8BYNs2k
  - id: standing-jump
    name: Standing jump
    category: jumping
    importance: useful
    description: Produce horizontal distance from a stable two-foot takeoff.
    tutorial: https://www.youtube.com/watch?v=K8DtVb0ydc8
  - id: plyometric-jumps
    name: Plyometric jumps
    category: jumping
    importance: optional
    description: Elastic rebounding jumps, added only after ordinary jump volume is comfortable.
    tutorial: https://www.youtube.com/watch?v=cytB585tI8U
  - id: running-jump
    name: Running jump
    category: jumping
    importance: useful
    description: Turn approach speed into a deliberate takeoff and stable landing.
    tutorial: https://www.youtube.com/watch?v=_D6WsID--IQ
  - id: strides
    name: Strides
    category: jumping
    importance: optional
    description: Link alternating takeoffs across targets while maintaining rhythm and line.
    tutorial: https://www.youtube.com/watch?v=IAnd7gSgHGg
  - id: wall-run
    name: Wall run
    category: walls
    importance: optional
    description: Use a purposeful foot contact to gain height or redirect movement.
    tutorial: https://www.youtube.com/watch?v=cnijAVbly84
  - id: ginga
    name: Ginga
    category: ground
    role: support
    origin: capoeira
    functions: [locomotion, rhythm, coordination]
    importance: useful
    description: A relaxed, shifting base that builds rhythm, coordination, and transitions between positions.
  - id: negativa
    name: Negativa
    category: ground
    role: support
    origin: capoeira
    functions: [ground-transitions, unilateral-support, hip-mobility]
    importance: useful
    description: A low, supported position for moving safely between standing and the ground.
  - id: role
    name: Rolê
    category: ground
    role: support
    origin: capoeira
    functions: [ground-transitions, coordination, spatial-awareness]
    importance: useful
    description: A circular ground transition that links supported positions with a return to movement.
  - id: meia-lua-de-frente
    name: Meia-lua de frente
    category: rotation
    role: support
    origin: capoeira
    functions: [rotation, balance, coordination]
    importance: optional
    description: A controlled front crescent kick for rotational coordination and balance.
  - id: queixada
    name: Queixada
    category: rotation
    role: support
    origin: capoeira
    functions: [rotation, balance, coordination]
    importance: optional
    description: A turning, outside-in kick that develops rotation and controlled reorientation.
  - id: armada
    name: Armada
    category: rotation
    role: support
    origin: capoeira
    functions: [rotation, spatial-awareness, balance]
    importance: optional
    description: A spinning kick practiced for deliberate turning, orientation, and balance.
  - id: pogos
    name: Pogos
    category: jumping
    role: support
    origin: calisthenics
    functions: [elasticity, ankle-strength, reactive-landing]
    importance: useful
    description: Small, controlled two-foot rebounds that develop ankle elasticity and quiet reactive landings.
  - id: skipping-drills
    name: Skipping drills
    category: jumping
    role: support
    origin: calisthenics
    functions: [elasticity, coordination, rhythm]
    importance: useful
    description: Light skipping and B-skip patterns for rhythm, coordination, and springy running mechanics.
